[project]
name = "teamplay-talk"
version = "0.1.0"
description = "팀플 협업 MCP 서버 (PlayMCP 공모전 출품)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "python-dotenv>=1.0",
]

[project.scripts]
teamplay-talk = "teamplay_talk.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teamplay_talk"]
